[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"
members = [
    "bin/morph-statetest",
    "bin/morph-reth",
    "crates/chainspec",
    "crates/consensus",
    "crates/engine-api",
    "crates/evm",
    "crates/node",
    "crates/rpc",
    "crates/payload/builder",
    "crates/payload/types",
    "crates/primitives",
    "crates/reference-index",
    "crates/revm",
    "crates/txpool",
]

[workspace.lints]
[workspace.lints.clippy]
dbg-macro = "warn"
manual-string-new = "warn"
uninlined-format-args = "warn"
use-self = "warn"
redundant-clone = "warn"
default-constructed-unit-structs = "allow"

[workspace.lints.rust]
rust-2018-idioms = "warn"
unreachable-pub = "warn"
unused-must-use = "warn"
redundant-lifetimes = "warn"
unnameable-types = "warn"

[workspace.lints.rustdoc]
all = "warn"

# Speed up compilation time for dev builds by reducing emitted debug info.
# NOTE: Debuggers may provide less useful information with this setting.
# Uncomment this section if you're using a debugger.
[profile.dev]
# https://davidlattimore.github.io/posts/2024/02/04/speeding-up-the-rust-edit-build-run-cycle.html
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Meant for testing - all optimizations, but with debug assertions and overflow checks.
[profile.hivetests]
inherits = "test"
opt-level = 3
lto = "thin"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

# Use the `--profile profiling` flag to keep line-table symbols in a release
# build — suitable for production flame graphs.
# e.g. `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
incremental = true

# Include debug info in benchmarks too.
[profile.bench]
inherits = "profiling"

# Maximum runtime performance. Fat LTO + single codegen unit; use for
# throughput-sensitive production binaries (expect noticeably slower link).
[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

# Deterministic release profile for reproducible production builds.
[profile.reproducible]
inherits = "release"
panic = "abort"
codegen-units = 1
incremental = false

[workspace.dependencies]
morph-chainspec = { path = "crates/chainspec", default-features = false }
morph-consensus = { path = "crates/consensus", default-features = false }
morph-engine-api = { path = "crates/engine-api", default-features = false }
morph-evm = { path = "crates/evm", default-features = false }
morph-node = { path = "crates/node"}
morph-payload-builder = { path = "crates/payload/builder", default-features = false }
morph-payload-types = { path = "crates/payload/types", default-features = false }
morph-primitives = { path = "crates/primitives", default-features = false }
morph-reference-index = { path = "crates/reference-index", default-features = false }
morph-rpc = { path = "crates/rpc" }
morph-revm = { path = "crates/revm", default-features = false }
morph-txpool = { path = "crates/txpool", default-features = false }

