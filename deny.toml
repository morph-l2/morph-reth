# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
yanked = "warn"
ignore = [
    # https://rustsec.org/advisories/RUSTSEC-2024-0436 paste! is unmaintained
    "RUSTSEC-2024-0436",
    # https://rustsec.org/advisories/RUSTSEC-2025-0141 bincode is unmaintained
    "RUSTSEC-2025-0141",
    # https://rustsec.org/advisories/RUSTSEC-2026-0097 rand unsound with custom logger
    # pinned transitively via reth; we don't install a custom logger so this is
    # a false positive in our usage, but cargo-deny can't see usage
    "RUSTSEC-2026-0097",
    # https://rustsec.org/advisories/RUSTSEC-2026-0098 rustls-webpki URI name constraints
    "RUSTSEC-2026-0098",
    # https://rustsec.org/advisories/RUSTSEC-2026-0099 rustls-webpki wildcard name constraints
    "RUSTSEC-2026-0099",
    # https://rustsec.org/advisories/RUSTSEC-2026-0118 hickory-proto NSEC3 validation loop
    # pinned transitively via reth-dns-discovery -> hickory-resolver ^0.25; no 0.25 fix is available
    "RUSTSEC-2026-0118",
    # https://rustsec.org/advisories/RUSTSEC-2026-0119 hickory-proto O(n^2) name compression
    # fixed in hickory-proto 0.26.1, but hickory-resolver ^0.25 cannot select it
    "RUSTSEC-2026-0119",
]

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.8
# Ignore private workspace members entirely
private = { ignore = true }

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.7 short identifier (+ optional exception)].
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    # https://github.com/rustls/webpki/blob/main/LICENSE ISC Style
    "LicenseRef-rustls-webpki",
    # https://github.com/briansmith/ring/blob/main/LICENSE ISC + OpenSSL + SSLeay
    "LicenseRef-ring",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

exceptions = [
    { allow = ["MPL-2.0"], name = "option-ext" },
]

[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "rustls-webpki"
expression = "LicenseRef-rustls-webpki"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-git = [
    "https://github.com/paradigmxyz/reth",
    "https://github.com/sigp/discv5",
]
