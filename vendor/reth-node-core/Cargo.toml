[package]
edition = "2024"
rust-version = "1.95"
name = "reth-node-core"
version = "2.5.2"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
homepage = "https://paradigmxyz.github.io/reth"
