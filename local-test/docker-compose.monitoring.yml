name: morph-monitoring

services:
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../etc/grafana/dashboards:/etc/grafana/provisioning_temp/dashboards:ro
    # Copy dashboards to a writable path, replace placeholders, then start.
    # ${VAR_INSTANCE_LABEL} → "service"  (our Prometheus service label)
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /var/lib/grafana/dashboards
        cp /etc/grafana/provisioning_temp/dashboards/morph-reth.json /var/lib/grafana/dashboards/morph-reth.json
        sed -i 's/\$${VAR_INSTANCE_LABEL}/service/g' /var/lib/grafana/dashboards/morph-reth.json
        sed -i 's/\$${datasource}/Prometheus/g' /var/lib/grafana/dashboards/morph-reth.json
        sed -i 's/\$${DS_PROMETHEUS}/Prometheus/g' /var/lib/grafana/dashboards/morph-reth.json
        /run.sh
