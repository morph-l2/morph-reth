[package]
name = "morph-evm"
description = "Morph EVM implementation"

version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
morph-chainspec.workspace = true
morph-primitives = { workspace = true, features = ["serde-bincode-compat"] }
morph-revm.workspace = true
morph-payload-types = { workspace = true, optional = true }

reth-chainspec.workspace = true
reth-evm.workspace = true
reth-ethereum-primitives = { workspace = true, features = ["serde"] }
reth-revm.workspace = true
reth-primitives-traits.workspace = true
reth-rpc-eth-api = { workspace = true, optional = true }

alloy-evm.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-eth.workspace = true

derive_more.workspace = true
thiserror.workspace = true
revm.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
alloy-genesis.workspace = true
rayon.workspace = true

[features]
default = []
serde-bincode-compat = [
    "morph-primitives/serde-bincode-compat",
]
# Engine-API payload execution (the `engine` module) requires `reth-evm/std`
# (`ConfigureEngineEvm`) and `morph-payload-types`; both transitively pull in
# `reth-primitives-traits/quanta`, which does not compile for SP1's zkvm
# target. Kept off by default so zkvm guest builds stay quanta-free; node
# compositions enable it (see `morph-node`).
engine = ["dep:morph-payload-types", "reth-evm/std"]
rpc = ["dep:reth-rpc-eth-api", "morph-revm/rpc"]
