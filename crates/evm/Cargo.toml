[package]
name = "morph-evm"
description = "Morph EVM implementation"

version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
morph-chainspec.workspace = true
morph-primitives = { workspace = true, features = ["serde-bincode-compat"] }
morph-revm.workspace = true

reth-chainspec.workspace = true
reth-evm.workspace = true
reth-ethereum-primitives = { workspace = true, features = ["serde"] }
reth-revm.workspace = true
reth-primitives-traits.workspace = true
reth-rpc-eth-api = { workspace = true, optional = true }

alloy-evm.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-eth.workspace = true

derive_more.workspace = true
thiserror.workspace = true
revm.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
alloy-genesis.workspace = true
rayon.workspace = true

[features]
default = []
serde-bincode-compat = [
    "morph-primitives/serde-bincode-compat",
]
rpc = ["dep:reth-rpc-eth-api", "morph-revm/rpc"]

# Host-only dependencies/features: `reth-evm/std` and `reth-revm/std`
# transitively enable `reth-ethereum-primitives/std` ->
# `reth-primitives-traits/quanta`, which does not compile for SP1's zkvm
# target; the workspace declarations stay `default-features = false` and `std`
# is added back here for non-zkvm targets only. `morph-payload-types` is only
# used by the `engine` module, which is also host-only; its subtree
# (`morph-primitives/reth-codec` -> `reth-db-api` ->
# `reth-ethereum-primitives/reth-codec`) hits the same `quanta` chain.
[target.'cfg(not(target_os = "zkvm"))'.dependencies]
morph-payload-types.workspace = true
reth-evm = { workspace = true, features = ["std"] }
reth-revm = { workspace = true, features = ["std"] }
