[package]
name = "morph-revm"

version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
morph-primitives.workspace = true
morph-chainspec.workspace = true

reth-evm.workspace = true
reth-ethereum-primitives = { workspace = true, features = ["serde"] }
reth-storage-api = { workspace = true, optional = true }
reth-rpc-eth-types = { workspace = true, optional = true }

revm.workspace = true

alloy-evm.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-sol-types.workspace = true
alloy-eips.workspace = true

auto_impl.workspace = true
derive_more.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
eyre.workspace = true
alloy-primitives = { workspace = true, features = ["rand"] }

[features]
reth = ["dep:reth-storage-api"]
rpc = ["dep:reth-rpc-eth-types"]

# `reth-evm/std` transitively enables `reth-ethereum-primitives/std` ->
# `reth-primitives-traits/quanta`, which does not compile for SP1's zkvm
# target. The workspace declaration of `reth-evm` is `default-features = false`
# and `std` is added back here for non-zkvm targets only.
[target.'cfg(not(target_os = "zkvm"))'.dependencies]
reth-evm = { workspace = true, features = ["std"] }
