name: "CodeQL Config"

# Suppress hard-coded-cryptographic-value alerts in test code.
# Test files legitimately use known test mnemonics/wallets (Hardhat/Foundry
# standard test accounts) — these are not production secrets.
query-filters:
  - exclude:
      id: rust/hard-coded-cryptographic-value

paths-ignore:
  - "**/tests/**"
  - "**/*test_utils*"
  - "**/src/test*"
