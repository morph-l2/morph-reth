name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0)"
        required: true
      dry_run:
        description: "Dry run (skip release creation)"
        type: boolean
        default: true
      profile:
        description: "Cargo profile for release binaries"
        type: choice
        default: "profiling"
        options:
          - profiling
          - maxperf
          - release

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Determine tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid tag format: '$TAG'. Expected format like v0.1.0 or v0.1.0-rc.1"
              exit 1
            fi
            REF="refs/tags/${TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            REF="${GITHUB_REF}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.ref }}
          persist-credentials: false

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "morph-reth") | .version')
          TAG_VERSION="${{ needs.extract-version.outputs.version }}"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [[ "$TAG_VERSION" != "$CARGO_VERSION"* ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [extract-version, check-version]
    if: ${{ !cancelled() && needs.check-version.result == 'success' }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: morph-reth-${{ needs.extract-version.outputs.version }}-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            archive: morph-reth-${{ needs.extract-version.outputs.version }}-aarch64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.target }}

      - name: Install cross main
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Resolve build profile
        id: profile
        run: |
          # Tag push -> maxperf (peak throughput for public releases).
          # workflow_dispatch -> user-selected profile (defaults to profiling).
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PROFILE="${{ inputs.profile }}"
          else
            PROFILE="maxperf"
          fi
          # Cargo's target dir is "debug" for dev, otherwise the profile name.
          if [[ "$PROFILE" == "dev" ]]; then
            PROFILE_DIR="debug"
          else
            PROFILE_DIR="$PROFILE"
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "profile_dir=$PROFILE_DIR" >> "$GITHUB_OUTPUT"
          echo "Resolved profile: $PROFILE (target dir: $PROFILE_DIR)"

      - name: Build binary
        run: make build-${{ matrix.target }} PROFILE=${{ steps.profile.outputs.profile }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/${{ steps.profile.outputs.profile_dir }}/morph-reth dist/
          cd dist
          tar czf ../${{ matrix.archive }}.tar.gz morph-reth
          cd ..
          sha256sum ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256

  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: [extract-version, build]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-version.outputs.ref }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREVIOUS_TAG}..HEAD)
          else
            CHANGELOG=$(git log -n 20 --pretty=format:"- %s")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.extract-version.outputs.version }}
          REPO_NAME: ${{ github.repository }}
        run: |
          PRERELEASE=""
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            PRERELEASE="--prerelease"
          fi

          cat <<ENDBODY > release_notes.md
          ## Summary

          <!-- Add a summary of the release, including critical bug fixes, new features, and breaking changes. -->

          ## All Changes

          ${{ steps.changelog.outputs.CHANGELOG }}

          ## Binaries

          | System | Architecture | Binary |
          |:---:|:---:|:---:|
          | <img src="https://www.svgrepo.com/download/473700/linux.svg" width="32"/> | x86_64 | [morph-reth-${VERSION}-x86_64-linux.tar.gz](https://github.com/${REPO_NAME}/releases/download/v${VERSION}/morph-reth-${VERSION}-x86_64-linux.tar.gz) |
          | <img src="https://www.svgrepo.com/download/473700/linux.svg" width="32"/> | aarch64 | [morph-reth-${VERSION}-aarch64-linux.tar.gz](https://github.com/${REPO_NAME}/releases/download/v${VERSION}/morph-reth-${VERSION}-aarch64-linux.tar.gz) |
          | <img src="https://www.svgrepo.com/download/473589/docker.svg" width="32"/> | Docker | [ghcr.io/morph-l2/morph-reth:v${VERSION}](https://ghcr.io/morph-l2/morph-reth) |
          ENDBODY

          gh release create "v${VERSION}" \
            --verify-tag \
            --draft \
            --title "v${VERSION}" \
            --notes-file release_notes.md \
            $PRERELEASE \
            artifacts/*
